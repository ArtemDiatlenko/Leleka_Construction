<section class="statistics-container" *transloco="let t" [attr.aria-label]="t('stats.ariaLabel')">
  <div class="stats-grid">
    <div class="stat-item" *ngFor="let stat of stats; trackBy: trackByTitle">
      <div class="stat-value">{{ stat.value }}</div>
      <div class="stat-title">{{ stat.title }}</div>
    </div>
  </div>
</section>
